# netlify.toml — Next.js 15 App Router on Netlify
#
# Runtime note (intentional deviation from the legacy recipe): Netlify runs
# Next.js via the built-in "Next.js Runtime" (v5+). The old
# [[plugins]] package = "@netlify/plugin-nextjs" entry is DEPRECATED — the
# platform warns and refuses to deploy where the managed runtime is active,
# and manually installing the plugin package causes exactly the version
# conflict it tells you to avoid. Framework detection below binds the runtime;
# no npm dependency is added.

[build]
  command = "npm run build"
  publish = ".next"          # ALWAYS repo-relative — never an absolute path.
  framework = "#nextjs"      # binds the managed Next.js Runtime (v5+):
                             # routing, server actions, image optimization and
                             # middleware run there. Do NOT also add
                             # @netlify/plugin-nextjs to netlify.toml or
                             # package.json — the plugin is retired and the
                             # runtime guardrail fails builds that re-add it.
  # "#nextjs" selects the managed Next.js runtime (routing, server actions,
  # image optimization, middleware all execute there — CSP nonce + session
  # refresh in src/middleware.ts keep working; nothing to port).

  [build.environment]
    NODE_VERSION = "20"          # matches next@15.5 engines; pin beats auto-detect
    NEXT_TELEMETRY_DISABLED = "1"
    NPM_CONFIG_FUND = "false"
    NPM_CONFIG_AUDIT = "false"
  # NOTE: 2-space continuation is fine, TOML keys are whitespace-insensitive.
  # Secrets scanning stays ENABLED — this is an explicit allow-list, not a
  # mute: only values that are public BY DESIGN are omitted (the public FX
  # endpoint appears in .env.example/docs/code defaults as documentation,
  # and NEXT_PUBLIC_* values must be baked into client bundles to work).
  # Real secrets (PAYSTACK_SECRET_KEY, SUPABASE_SERVICE_ROLE_KEY,
  # CRON_SECRET, FX_PROVIDER_API_KEY) remain actively scanned.
  SECRETS_SCAN_OMIT_KEYS = "FX_PROVIDER_BASE_URL,FX_PROVIDER_BASE_CURRENCY,FX_CACHE_TTL_SECONDS,FX_MAX_AGE_SECONDS,MANUAL_FX_RATES,PAYSTACK_ENABLED_CURRENCIES,CHECKOUT_QUOTE_TTL_SECONDS,DEMO_FALLBACK,USE_DEMO_DATA,NEXT_PUBLIC_USE_DEMO_DATA,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY"

[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.images]
  compress = true

# ── Static headers ────────────────────────────────────────────────────────
# Deliberately minimal: CSP (incl. frame-ancestors 'self') is emitted per
# request by Next middleware with a fresh nonce — netlify.toml headers are
# STATIC and must not duplicate or fight it. X-Frame-Options is omitted for
# the same reason (CSP supersedes).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  # immutable Next asset fingerprinting (runtime already sets this for
  # /_next/static; belt-and-braces for upload/ and any public hashed assets)
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ── Routing ───────────────────────────────────────────────────────────────
# NO catch-all SPA rewrite on purpose: /./index.html-style fallbacks break
# App Router SSR (they would shadow /products, /booking, all RSC routes).
# Runtime v5 serves the routes manifest itself — App Router + dynamic
# force-dynamic pages (cart/checkout/products) are executed, not statically
# rewritten. Netlify-specific edge routing therefore needs zero config here.

# Cron note: the app's maintenance job stays an EXTERNAL caller of
# POST /api/jobs/maintenance with the CRON_SECRET bearer token (Netlify cron
# can schedule a function but this app's job is an API route; keep the
# GitHub-Actions/uptime cron that already targets it).
